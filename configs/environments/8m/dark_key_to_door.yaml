protocol: native-keydoor-fixed500-first8  # names the task, which is unchanged; the 8M study separates by output root
status: C1
environment:
  name: dark_key_to_door
  benchmark: native-keydoor-fixed500-first8  # the task protocol is unchanged; only the study recipe moves
  size: 8
  attempts: 8
  horizon: 50
  meta_horizon: 500
  randomized_actions: false
  parallel_envs: 16
training:
  epochs: 1000  # 1000 x 500 x 16 = 8,000,000 nominal collected decisions; the measured count is recorded
  start_learning_epoch: 1
  timesteps_per_epoch: 500
  batches_per_epoch: 128
  validation_timesteps: 500
  validation_interval: 50
  checkpoint_interval: 50  # the grid holds 4M (e500) and 8M (e1000), and every window endpoint in EXPERIMENTS section 5
  batch_size: 16
  max_sequence_length: 500
  trajectory_length: 501
  replay_capacity: 10000
  reward_multiplier: 100.0
  epsilon_anneal_steps: 50000  # absolute actor-local vector calls, unchanged from the 4M recipe
  learning_rate: 0.0001
  warmup_steps: 128
  gradient_clip: 1.0
  weight_decay: 0.001
  mixed_precision: 'no'
  dataloader_workers: 0
  torch_compile: false
  exploration: bilevel_epsilon_greedy
  exploration_rollout_horizon: 500
  verbose: false
evaluation:
  splits:
    development:
      source: development
      count: 64
    final:
      source: final-revised  # untouched band; the 4M study evaluated every task of `final`
      count: 256
    confirmation:
      source: confirmation  # ME0: the Memo comparator's 256-task panel, band 5,000,000-5,000,255, disjoint from every other split; opened only after the recipe, contrasts and all three Memo endpoints are fixed
      count: 256
  rollout_seeds:
  - 0
  primary_metric: doors_completed  # R4: completed doors in the fixed 500-call task (a count, all attempts retained); door_success_first8 is the historical secondary metric
  retention: complete  # R4: every attempt of the 500-call task is exported, the unfinished one marked partial
  sampling_unit: task
  checkpoint_rule: collection-endpoint-primary-development-selected-secondary
memory:
  summary:
    segment_length: 32   # C
    memory_tokens: 4     # M
  window:
    segment_length: 40   # R3 measured match: largest W within the DAT summary's 249,868 B per actor (window 246,084 B, residual 3,784 B); equals C + 2M only because M=4 tokens are less than one 6,152 B slot
qualification:
  reference: the larger of the random-policy (three action seeds) and the declared public-current-observation sweep policy, in completed doors per 500-call task, on the same development task roster
  minimum_improvement: 0.1
  maximum_primary: 0.95
  sustained_checkpoints: 3
  maximum_fits: 2
  maximum_device_hours: 24.0
  fallback: The 8M study replaces the old two-fit/24-hour launch gate for this protocol. A cell that
    stops before the 8M endpoint is labelled incomplete and is never substituted into an endpoint panel.
    Preserve negative evidence; no automatic retuning.
  evidence_diagnostic: Actual bounded public histories; exact equality of every current packet field,
    RL2 feedback and time; conflicting correct answers/actions plus public-history resolution. Route ties
    and weak random policies are not necessity evidence.
documentation:
  source:
    amago: 3.4.0
    environment: https://github.com/UT-Austin-RPL/amago/blob/v3.4.0/amago/envs/builtin/toy_gym.py (RoomKeyDoor)
    example: https://github.com/UT-Austin-RPL/amago/blob/v3.4.0/examples/05_dark_key_door.py
    adapter: reasoned_icrl.environments.dark_key_to_door_native.DarkKeyToDoorNativeEnv; recipe resolved
      by experiments/benchmarks.py
    popgym: not used
    recipe_note: 'R1: the 8M study recipe. 1,000 epochs, 16 actors, 500 vector calls
      per actor per epoch, 128 batches per learning epoch, batch 16. Training seeds 42/100/2026. The
      nominal product is 8,000,000 collected scalar decisions; systems.json records the measured
      charged-call, physical-action and reset-only counts separately and never presents the product as
      measured. The 4M/500-epoch contract at configs/environments/dark_key_to_door.yaml is unchanged
      and still reproduces the historical study.'
  information:
    observation: 'Box(4): [x/8, y/8, has_key, physical_time/50]; dark=True.'
    action: 'Discrete(5): left/up/right/down/stay in native index order.'
    feedback: Native v3.4.0 observation has no embedded previous action/reward. Keep them once in AMAGO
      RL2. Reset-only selected actions are not physical actions.
    reward: 1 on key acquisition, 1 on door completion; at most 2 per physical attempt. Reset-only steps
      reward 0. Store native feedback before reward_multiplier=100.
    projection: Read the four public Box values directly as float32; no key/door coordinate recovery.
    policy_fields:
    - position_x
    - position_y
    - has_key
    - episode_time
    - rl2_reward
    - rl2_previous_action
    excluded_fields:
    - key
    - goal
    - start
    - dirs
    - task_seed
    - success_label
    - optimal_path
  lifecycle:
    task_variation: New hidden start/key/door locations at each outer reset; fixed native action directions.
    persistence: Start/key/door locations persist for all 500 meta steps; possession resets per physical
      attempt.
    termination: An attempt ends at door completion or 50 physical actions; a subsequent step resets without
      executing its action. Outer terminated=True and truncated=True at global_time=500.
    bootstrap: No value bootstrap at the outer finite-horizon terminal; physical attempt completion is
      not a learner terminal.
    reset: Retain history during physical/reset-only steps; clear at outer reset. Include initial token
      plus up to 500 step tokens.
    relabeling: none
  history:
  - 'Tier 0 of the 8M study. The 4M panel under outputs/summary-memory/ is a labelled historical
    comparison at its own protocol identity, not a baseline for these cells.'
  - 'R1 kept the primary metric at door_success_first8; R4 gives the
    retained-attempt door count its own metric identity, doors_completed, and retires the former
    capacity.summary_grid metadata: C=32/M=4/W=40 is fixed, with no development capacity selection.'
